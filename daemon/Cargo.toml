[package]
name = "launchpad-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LaunchPad init daemon - PID 1 service manager for TontooOS"

[[bin]]
name = "launchpad-daemon"
path = "src/main.rs"

[dependencies]
launchpad-lib = { path = "../lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
inotify = "0.11"
