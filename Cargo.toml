[package]
name = "launchpad-lib"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "LaunchPad client library for TontooOS apps (Dock, Launcher, etc.)"
repository = "https://github.com/TontooOS/LaunchPad"

[lib]
crate-type = ["cdylib", "rlib"]

# Foundation is the only dependency: socket JSON uses foundation::serialization
# and .service files are read with foundation::yaml.
[dependencies]
foundation = { path = "../Foundation" }
