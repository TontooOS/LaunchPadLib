[package]
name = "launchpad-lib"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "LaunchPad client library for TontooOS apps (Dock, Launcher, etc.)"
repository = "https://github.com/TontooOS/LaunchPad"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
