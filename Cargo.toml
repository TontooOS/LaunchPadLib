[package]
name = "launchpad-lib"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "LaunchPad client library for TontooOS apps (Dock, Launcher, etc.)"
repository = "https://github.com/TontooOS/LaunchPad"

[lib]
crate-type = ["cdylib", "rlib"]

# serde derive stays: the LaunchPad daemon parses ServiceConfig files with
# serde_yaml, which needs these derives. Socket JSON uses Foundation.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
foundation = { path = "../Foundation" }
