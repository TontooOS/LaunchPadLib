[package]
name = "launchpad-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LaunchPad client library for TontooOS apps (Dock, Launcher, etc.)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
